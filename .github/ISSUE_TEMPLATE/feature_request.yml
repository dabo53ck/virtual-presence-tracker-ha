name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part is this about?
      options:
        - Setup (add integration, add or edit a virtual tracker)
        - Tracker, switch or the household sensor
        - The prompt when the house empties
        - The reminder for a tracker that has been on too long
        - The notification on the phone (Companion App)
        - Events and actions (the automation contract)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation or frustration behind the request, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: >
        The behaviour, entity, action or option you have in mind. A rough sketch of
        the automation or dashboard that would use it helps a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Automations on the event entity, templates, helpers, other integrations.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: I read the milestone plan in `docs/DESIGN.md` — this is not already planned there.
