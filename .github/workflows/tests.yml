name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # homeassistant 2026.9 requires Python >=3.14.2, and
          # pytest-homeassistant-custom-component follows it.
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: pytest --cov=custom_components/virtual_presence_tracker --cov-report=term-missing
